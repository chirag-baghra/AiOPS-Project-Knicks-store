apiVersion: batch/v1
kind: Job
metadata:
  name: knicks-db-restore
  namespace: knicks
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: restore
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres..."
              until pg_isready -h knicks-postgres -U postgres; do
                sleep 2
              done

              echo "Pre-creating databases..."
              for DB in auth_db orders_db products_db users_db; do
                psql -h knicks-postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 || \
                  psql -h knicks-postgres -U postgres -c "CREATE DATABASE $DB"
              done

              echo "Restoring dump (errors on existing objects are expected and ignored)..."
              psql -h knicks-postgres -U postgres -f /dump/Knicks_full.sql || true

              echo "Restore completed."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: knicks-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: dump
              mountPath: /dump
      volumes:
        - name: dump
          configMap:
            name: knicks-db-dump
