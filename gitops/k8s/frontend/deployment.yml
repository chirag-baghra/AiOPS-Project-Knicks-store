apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: knicks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 625242091771.dkr.ecr.us-east-1.amazonaws.com/frontend:8bdb519e9efc5ff588d82a8c67022a7e0558a74a
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_API_URL
              value: "http://gateway:3001/api"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: knicks
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP

