apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knicks-frontend
  namespace: knicks
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    kubernetes.io/ingress.class: alb

spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 3001

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
